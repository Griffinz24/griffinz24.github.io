        end_date: Present
        summary: Conducts water resources and environmental research as part of the Etheridge Lab. My focus is on data management and water quality.
        highlights:
          - Created and applied code in RStudio to seamlessly analyze data for consolidation and analysis.
          - Worked alongside community and federal partners to further mutual goals and apply research findings.
          - Utilized key geospatial analysis skills to categorize and identify land use over 5,000+ acres of watershed.

      - company: Naval Facilities Engineering Systems Command Southeast
        position: Environmental Engineering Intern
        location: Jacksonville, FL
        start_date: May 2026
        end_date: Jul 2026
        summary: Assisted with environmental compliance and military construction reviews.
        highlights:
          - Assisted in engineering plan review for large scale military construction throughout the southeast.
          - Developed scripts in Python to analyze $4 million in hazardous waste disposition costs.

      - company: Civil Design Concepts, P.A.
        position: Predevelopment Civil/Site Engineering Intern
        location: Asheville, NC
        start_date: Jun 2025
        end_date: Aug 2025
        summary: Focused on site design, regulatory compliance, and geospatial site analysis.
        highlights:
        - Balanced federal, state, and local regulation in the design of high-level site design and planning.
        - Strengthened skills in site research for sites ranging in 10-300 acres, focusing on constructability, local and state ordinances, utility locations, wetland impacts, and flood risk.
        - Utilized AutoCAD Civil3D and GIS software for the generation of 30+ individual site plans.

      - company: Civil Design Concepts, P.A.
        position: Civil/Site Engineering Intern
        location: Asheville, NC
        start_date: Feb 2024
        end_date: Aug 2024
        highlights:
        - Developed key drafting and site generation skills while still in high school.
        - Administered site visits to ensure plans were followed and violations were addressed in an adequate manner.

  

